# Spice labels — one [[spice]] block per label. Only `name` is required.
#
#   name     = "Smoked paprika"           # big title (auto-shrinks / wraps to fit)
#   subtitle = "Pimentón de la Vera"      # optional: local / latin / variety name
#   contents = { coriander = 4, cumin = 2 }   # optional: blend ratio, in the order written
#   source   = "La Vera, Spain"           # optional: origin or shop
#   note     = "toast, then grind"        # optional: one short free-text line
#   url      = "https://..."             # optional: QR code target (keep it SHORT)
#   copies   = 2                          # optional: how many identical labels (default 1)
#
# Rebuild with ./build.sh — the PDF is labels.pdf.

